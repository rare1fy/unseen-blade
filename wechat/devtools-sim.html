<!doctype html>
<meta charset="utf-8">
<title>WeChat devtools stand-in</title>
<style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script>
// 11-18: a stand-in for the WeChat devtools' game context, to catch what the no-DOM worker sandbox can't: there the game runs next to a
// REAL HTMLDocument whose methods are read-only (the devtools threw 「Cannot assign to read only property 'createElementNS'」 at the
// glue). A fake `wx` like wechat/sandbox's, GameGlobal = window, then the built game.js run inside a function (the runtime require()s
// it). As in the devtools (both errors the user hit, act-55 and act-56): document.createElementNS is read-only but createElement is
// writable — overwriting it takes the method off its document ("Illegal invocation" when called bare) — and the game code can't see
// HTMLDocument / Document (the document comes from another realm there), so an `instanceof HTMLDocument` test can't tell it's real.
// Served by tools/wx-devtools-sim.mjs next to the built project (?base=…).
(function () {
  'use strict';
  const q = new URLSearchParams(location.search), base = q.get('base') || '/proj/', W = innerWidth, H = innerHeight, dpr = devicePixelRatio || 1;
  // WeChat (the devtools AND phones, act-63 on a phone: only the title): getContext('webgl2') gives a real WebGL2 context, but there is
  // no global WebGL2RenderingContext — three.js decides WebGL2 by `typeof WebGL2RenderingContext !== 'undefined' && gl.constructor.name
  // === 'WebGL2RenderingContext'`, so it ran its WebGL1 path on a WebGL2 context: every WebGL1 extension it asked for came back null
  // (no instancing, no float textures, no derivatives, no depth texture…). Here the global is taken away before game.js runs (the sim
  // keeps its own reference). ?gl1=1: no WebGL2 at all, a WebGL1 without instancing / float textures (+ ?strip=A,B for more).
  const GL2 = window.WebGL2RenderingContext; if (q.get('gl1') !== '1') delete window.WebGL2RenderingContext;
  // a phone has no atob either (nor wx.base64ToArrayBuffer — 「vox: can't read … wx.base64ToArrayBuffer is not a function」, act-63)
  delete window.atob; delete window.btoa;
  { const gc = HTMLCanvasElement.prototype.getContext, NO = q.get('gl1') === '1' ? ['ANGLE_instanced_arrays', 'OES_texture_float', 'OES_texture_float_linear', ...(q.get('strip') || '').split(',').filter(Boolean)] : [];
    HTMLCanvasElement.prototype.getContext = function (type, attrs) {
      if (type === 'webgl2' && q.get('gl1') === '1') return null;
      const c = gc.call(this, type, attrs);
      if (c && (type === 'webgl' || type === 'experimental-webgl') && !c.__sim) {
        c.__sim = true; const ge = c.getExtension.bind(c), gs = c.getSupportedExtensions.bind(c);
        c.getExtension = n => NO.includes(n) ? null : ge(n); c.getSupportedExtensions = () => (gs() || []).filter(n => !NO.includes(n));
      }
      return c;
    }; }
  Object.defineProperty(document, 'createElementNS', { value: Document.prototype.createElementNS.bind(document), writable: false, configurable: false });
  const touch = { start: [], move: [], end: [], cancel: [] }; let first = null; const store = {};
  const sync = p => { const x = new XMLHttpRequest(); x.open('GET', new URL(p, location.origin + base), false); x.overrideMimeType('text/plain; charset=x-user-defined'); x.send(); if (x.status !== 200) throw new Error('no file ' + p); const s = x.responseText, b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 255; return b.buffer; };
  window.wx = {
    createCanvas() { if (!first) { first = document.createElement('canvas'); first.width = Math.round(W * dpr); first.height = Math.round(H * dpr); first.style.cssText = `width:${W}px;height:${H}px;display:block`; document.body.appendChild(first); return first; } return document.createElement('canvas'); },
    getSystemInfoSync: () => ({ windowWidth: W, windowHeight: H, screenWidth: W, screenHeight: H, pixelRatio: dpr, platform: 'devtools', system: 'sim', safeArea: { left: 0, right: W, top: 0, bottom: H, width: W, height: H } }),
    onTouchStart: f => touch.start.push(f), onTouchMove: f => touch.move.push(f), onTouchEnd: f => touch.end.push(f), onTouchCancel: f => touch.cancel.push(f),
    onWindowResize() {}, getLaunchOptionsSync: () => ({ query: {} }),
    createImage() { const im = new Image(); const set = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src').set; Object.defineProperty(im, 'src', { set(v) { set.call(im, new URL(v, location.origin + base).href); }, get() { return im.getAttribute('src'); } }); return im; },
    getFileSystemManager: () => ({ readFileSync: (p, enc) => { const b = sync(p); return enc ? new TextDecoder().decode(b) : b; }, readFile: o => { try { o.success({ data: sync(o.filePath) }); } catch (e) { o.fail && o.fail(e); } } }),
    loadSubpackage: o => { setTimeout(() => o.success && o.success({}), 10); return { onProgressUpdate() {} }; },
    getStorageSync: k => store[k] ?? '', setStorageSync: (k, v) => { store[k] = v; }, removeStorageSync: k => { delete store[k]; },
    createInnerAudioContext: () => ({ play() {}, stop() {}, pause() {}, destroy() {} }),
    loadFont: () => null, vibrateShort() {}, onHide() {}, onShow() {},
    // the native error dialog (wechat/glue.js shows the first error in one): recorded for the test
    showModal: o => { (window.__simModals = window.__simModals || []).push(String(o && o.content || '')); }, onError() {}, onUnhandledRejection() {},
  };
  // 11-18 (act-65 on a phone: a picture, no sound): sound as WeChat has it, per its documentation — no global AudioContext; a
  // WebAudioContext whose AudioParam has only `value` (no setValueAtTime / …RampToValueAtTime / setTargetAtTime /
  // cancelScheduledValues), no createConvolver, decodeAudioData with callbacks, resume / suspend that give nothing back. Made on the
  // page's own AudioContext; window.__simAudio counts contexts, decodes and sounds started, and keeps the gain nodes (for fades).
  { const AC = window.AudioContext || window.webkitAudioContext; delete window.AudioContext; delete window.webkitAudioContext;
    for (const m of ['setValueAtTime', 'linearRampToValueAtTime', 'exponentialRampToValueAtTime', 'setTargetAtTime', 'cancelScheduledValues', 'setValueCurveAtTime', 'cancelAndHoldAtTime']) delete AudioParam.prototype[m];
    const S = window.__simAudio = { contexts: 0, decoded: 0, decodeFailed: 0, started: 0, gains: [] };
    window.wx.createWebAudioContext = () => {
      const c = new AC(); S.contexts++;
      const o = { get state() { return c.state; }, get currentTime() { return c.currentTime; }, get sampleRate() { return c.sampleRate; }, get destination() { return c.destination; },
        resume() { c.resume(); }, suspend() { c.suspend(); }, close() { c.close(); },
        decodeAudioData(ab, ok, fail) { c.decodeAudioData(ab).then(b => { S.decoded++; ok(b); }, e => { S.decodeFailed++; if (fail) fail(e); }); },
        createBufferSource() { const s = c.createBufferSource(), st = s.start.bind(s); s.start = (...a) => { S.started++; return st(...a); }; return s; },
        createGain() { const g = c.createGain(); if (S.gains.length < 600) S.gains.push(g); return g; } };
      for (const m of ['createBuffer', 'createBiquadFilter', 'createDynamicsCompressor', 'createOscillator', 'createDelay', 'createAnalyser', 'createPanner', 'createWaveShaper', 'createConstantSource']) o[m] = c[m].bind(c);
      return o;
    }; }
  window.GameGlobal = window;
  window.__simTouch = (type, x, y) => { const ev = { touches: type === 'end' ? [] : [{ identifier: 1, clientX: x, clientY: y }], changedTouches: [{ identifier: 1, clientX: x, clientY: y }], timeStamp: Date.now() }; for (const f of touch[type] || []) f(ev); };
  window.__simErrors = []; addEventListener('error', e => window.__simErrors.push(String(e.message))); addEventListener('unhandledrejection', e => window.__simErrors.push('rejection ' + String(e.reason && e.reason.stack || e.reason)));
  // the runtime require()s game.js: its top-level `var`s are the module's own, not globals — so run it inside a function, as there
  addEventListener('DOMContentLoaded', () => { fetch(base + 'game.js').then(r => r.text()).then(t => { try { new Function('HTMLDocument', 'Document', t + String.fromCharCode(10) + '//# sourceURL=game.js')(undefined, undefined); } catch (e) { window.__simErrors.push(String(e && e.stack || e)); throw e; } }); });
})();
</script>
